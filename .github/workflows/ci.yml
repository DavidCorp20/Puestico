name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: carpooling_ve_test
          POSTGRES_USER: carpool
          POSTGRES_PASSWORD: carpool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build
        working-directory: api
        run: npm run build

      - name: Unit tests
        working-directory: api
        run: npx jest --ci

      # ON_ERROR_STOP es clave: sin eso psql seguía tras un error y el
      # paso terminaba en verde con la base a medio cargar. Así se nos
      # pasaron tres errores del esquema (ver migraciones 002 y 003).
      - name: Cargar esquema y migraciones
        env:
          PGPASSWORD: carpool_test
        run: |
          psql -h localhost -U carpool -d carpooling_ve_test -v ON_ERROR_STOP=1 \
            -f api/src/database/migrations/001_initial_schema.sql \
            -f api/src/database/migrations/002_fix_booking_seat_lock.sql \
            -f api/src/database/migrations/003_signup_only_needs_phone.sql

      - name: Cargar datos de prueba
        env:
          PGPASSWORD: carpool_test
        run: |
          psql -h localhost -U carpool -d carpooling_ve_test -v ON_ERROR_STOP=1 \
            -f api/src/database/seeds/001_seed_data.sql

      # Las pruebas que de verdad protegen el backend: corren contra
      # PostgreSQL con PostGIS, no contra simulaciones. Son las que
      # detectan la sobreventa de puestos y la búsqueda geográfica.
      - name: Pruebas contra la base real
        working-directory: api
        env:
          DATABASE_URL: postgresql://carpool:carpool_test@localhost:5432/carpooling_ve_test
        run: npm run test:db

  web:
    name: Web — build y pruebas de identidad, pago y chat
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22: `node:sqlite` (la persistencia) y el borrado de tipos
      # que usan las pruebas vienen incluidos desde esta versión.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Tipos
        working-directory: web
        run: npx tsc --noEmit

      # Esto es lo que faltaba: hasta ahora CI no miraba `web/` ni una
      # vez, o sea que no protegía el código que el usuario ejecuta.
      # Cubre normalización de teléfonos, que el código de verificación
      # no quede en claro, que una reserva no nazca pagada y las reglas
      # del chat.
      - name: Pruebas de identidad, pago y chat
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
