name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: carpooling_ve_test
          POSTGRES_USER: carpool
          POSTGRES_PASSWORD: carpool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build
        working-directory: api
        run: npm run build

      - name: Unit tests
        working-directory: api
        run: npx jest --ci

      - name: Load schema
        env:
          PGPASSWORD: carpool_test
        run: |
          psql -h localhost -U carpool -d carpooling_ve_test \
            -f api/src/database/migrations/001_initial_schema.sql

      - name: Load seed data
        env:
          PGPASSWORD: carpool_test
        run: |
          psql -h localhost -U carpool -d carpooling_ve_test \
            -f api/src/database/seeds/001_seed_data.sql
