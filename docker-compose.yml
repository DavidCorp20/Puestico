version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: carpooling_ve
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carpool_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/src/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./api/src/database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpool -d carpooling_ve"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://carpool:${DB_PASSWORD:-carpool_dev}@db:5432/carpooling_ve
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"

volumes:
  pgdata:
